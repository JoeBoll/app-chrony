---
name: Chrony (NTP peering)
version: 6.1.0-peering.3
slug: chrony_peering
description: >-
  chrony NTP server/client with symmetric peering, authentication keys,
  allow lists and refclock passthrough (fork of the community chrony app)
url: https://github.com/JoeBoll/app-chrony
startup: system
arch:
  - aarch64
  - amd64
hassio_api: true
init: false
host_network: true
# SYS_NICE: sched_priority. IPC_LOCK + SYS_RESOURCE: lock_all (chronyd
# raises RLIMIT_MEMLOCK before mlockall). realtime adds the rtprio
# and memlock ulimits. uart grants access to serial ports for gpsd.
# The PPS device is granted through the gps.pps_device option (device type),
# so nothing breaks when no GPS hat is fitted. No static devices: list.
privileged:
  - SYS_TIME
  - SYS_NICE
  - IPC_LOCK
  - SYS_RESOURCE
realtime: true
uart: true
options:
  set_system_clock: true
  mode: pool
  ntp_pool: pool.ntp.org
  ntp_server: []
  makestep_threshold: 0.1
  makestep_limit: -1
  default_minpoll: 4
  default_maxpoll: 6
  peers: []
  servers: []
  allow: []
  keys: []
  refclocks: []
  hwtimestamp: false
  lock_all: false
  sched_priority: 1
  gps:
    enabled: false
    nmea_source: shm
    nmea_offset: 0.2
    nmea_delay: 0.2
    pps_prefer: true
  extra_config: ""
schema:
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  set_system_clock: bool
  mode: list(pool|server|none)
  ntp_pool: str?
  ntp_server:
    - str?
  makestep_threshold: float
  makestep_limit: int
  default_minpoll: int(-7,24)?
  default_maxpoll: int(-7,24)?
  peers:
    - address: str
      key: int(1,)?
      xleave: bool?
      minpoll: int(-7,24)?
      maxpoll: int(-7,24)?
      filter: int(1,)?
      iburst: bool?
      prefer: bool?
  servers:
    - address: str
      key: int(1,)?
      xleave: bool?
      minpoll: int(-7,24)?
      maxpoll: int(-7,24)?
      filter: int(1,)?
      iburst: bool?
      prefer: bool?
  allow:
    - str
  keys:
    - id: int(1,)
      type: list(MD5|SHA1|SHA256|SHA384|SHA512|AES128|AES256)
      secret: password
  refclocks:
    - str
  local_stratum: int(1,15)?
  hwtimestamp: bool
  lock_all: bool
  sched_priority: int(0,99)
  gps:
    enabled: bool
    serial_device: device(subsystem=tty)?
    pps_device: device?
    baud: int(1200,921600)?
    nmea_source: list(shm|sock)
    nmea_offset: float
    nmea_delay: float
    pps_offset: float?
    pps_prefer: bool
  extra_config: text?
